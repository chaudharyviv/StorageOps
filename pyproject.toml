[project]
name = "storageops"
version = "0.0.0"
description = "StorageOps Intelligence Platform: NetApp-only AI system on synthetic data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic",
    "polars",
    "duckdb",
    "fastapi",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
    "contracts*",
    "simulator*",
    "ingest*",
    "features*",
    "models*",
    "eval*",
    "api*",
    "mcp_server*",
    "agent*",
    "governance*",
    "ui*",
    "monitoring*",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
